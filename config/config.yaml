# Which ammeter types are part of this test run, and which port each one
# listens on. The exact protocol command is intentionally NOT duplicated here:
# it stays owned by each ammeter class (Ammeters/*.py) to avoid having two
# sources of truth for the same wire-protocol detail.
ammeters:
  greenlee:
    port: 5000
  entes:
    port: 5001
  circutor:
    port: 5002

testing:
  sampling:
    # Any complete, consistent combination of the 3 fields below is accepted;
    # fields that should not participate must be left null (see
    # src/testing/sampler.py for the exact rules and all supported
    # combinations). Currently configured: exactly 20 measurements, taken
    # back-to-back as fast as possible (no duration/frequency pacing).
    # Revisit before final submission (see my_help_files/work-documentation.he.html).
    measurements_count: 20
    total_duration_seconds: null
    sampling_frequency_hz: null
    # Minimum fraction of measurements that must succeed for a sampling run to
    # be considered valid (0.0-1.0). Below this, a clear error is raised
    # instead of silently returning statistics computed on too few samples.
    min_success_rate: 0.8

analysis:
  statistical_metrics:
    - mean
    - median
    - std_dev
    - min
    - max
  visualization:
    enabled: true
    plot_types:
      - line
      - histogram

result_management:
  results_dir: results
  format: json
